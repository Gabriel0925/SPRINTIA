<!DOCTYPE html>
<html lang="fr">
<head>
    <title>SPRINTIA - Convertisseur</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" type="image/png" href="../../assets/icons-SPRINTIA/icon-navigateur.png">
    <link rel="manifest" href="../../manifest.json">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SPRINTIA">
    <link rel="apple-touch-icon" href="../../assets/icons-SPRINTIA/icon-192.png">

</head>

<body>
    <div class="container-logo-dynamique">
        <div class="logo-dynamique"></div>
    </div>
    
    <section class="header">

        <div class="logo">SPRINTIA</div>
            
        <ul class="header-container-items">

            <li class="header-items" data-onglet="Entraînement">
                <i class="icon_entrainement"></i>
                Entraînement
            </li>
            <li class="header-items" data-onglet="Progression">
                <i class="icon_progression"></i>
                Progression
            </li>
            <li class="header-items selected" data-onglet="Outils">
                <i class="icon_outils"></i>
                Outils
            </li>
            <li class="header-items" data-onglet="Plus">
                <i class="icon_plus"></i>
                Plus
            </li>

        </ul>

    </section>
    <section class="tab-bars">

        <ul class="tab-bars-container-items">

            <li class="tab-bars-items" data-onglet="Entraînement">
                <i class="icon_entrainement"></i>
                <p class="tab-bars-items-name">Entraînement</p>
            </li>
            <li class="tab-bars-items" data-onglet="Progression">
                <i class="icon_progression"></i>
                <p class="tab-bars-items-name">Progression</p>
            </li>
            <li class="tab-bars-items selected" data-onglet="Outils">
                <i class="icon_outils"></i>
                <p class="tab-bars-items-name">Outils</p>
            </li>
            <li class="tab-bars-items" data-onglet="Plus">
                <i class="icon_plus"></i>
                <p class="tab-bars-items-name">Plus</p>
            </li>

        </ul>

    </section>

    <div class="toolbar">
        <h1>Convertisseur</h1>
        <div class="container-command">
            <i class="icon_info" onclick="window.location.href = 'a-propos.html'"></i>
        </div>
    </div>

    <section class="container-zone">

        <div class="form">
            <div class="container-input">
                <input type="number" id="kilometres" placeholder="Saisis les kilomètres" oninput="KmMiles()" autocomplete="off">
                <div class="label-input">Saisis les kilomètres</div>
            </div>
                    
            <div class="container-input">
                <input type="number" id="miles" placeholder="Ou saisis les miles" oninput="MilesKm()" autocomplete="off">
                <div class="label-input">Ou saisis les miles</div>
            </div>
        </div>

    </section>

    <script src="../../assets/base-js/base.js"></script>
    <script src="script-outil.js"></script>
    
    

</body>
</html>
