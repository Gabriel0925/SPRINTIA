<!DOCTYPE html>
<html lang="fr">
<head>
    <title>SPRINTIA - Zones Cardiaques</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" type="image/png" href="../../assets/icons-SPRINTIA/icon-navigateur.png">
    <link rel="manifest" href="../../manifest.json">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SPRINTIA">
    <link rel="apple-touch-icon" href="../../assets/icons-SPRINTIA/icon-192.png">

</head>

<body>
    <div class="container-logo-dynamique">
        <div class="logo-dynamique"></div>
    </div>
    
    <section class="header">
            
        <ul class="header-container-items">

            <li class="header-items" data-onglet="Entraînement">
                Entraînement
            </li>
            <li class="header-items" data-onglet="Progression">
                Progression
            </li>
            <li class="header-items" data-onglet="Discussion">
                Discussion
            </li>
            <li class="header-items selected" data-onglet="Outils">
                Outils
            </li>
            <li class="header-items" data-onglet="Plus">
                Plus
            </li>

        </ul>

    </section>
    <section class="tab-bars">

        <ul class="tab-bars-container-items">

            <li class="tab-bars-items" data-onglet="Entraînement">
                <i class="icon_entrainement"></i>
            </li>
            <li class="tab-bars-items" data-onglet="Progression">
                <i class="icon_progression"></i>
            </li>
            <li class="tab-bars-items" data-onglet="Discussion">
                <i class="icon_discussion"></i>
            </li>
            <li class="tab-bars-items selected" data-onglet="Outils">
                <i class="icon_outils"></i>
            </li>
            <li class="tab-bars-items" data-onglet="Plus">
                <i class="icon_plus"></i>
            </li>

        </ul>

    </section>

    
    <div class="toolbar">
        <h1>Zones Cardiaques</h1>
        <div class="container-command">
            <a href="a-propos.html">
                <i class="icon_info"></i>
            </a>
        </div>
    </div>

    <section class="container-zone">

        <div class="form">

            <select id="methode-user" autocomplete="off">
                <option value="RFC">Méthode : RFC (recommandé)</option>
                <option value="FC-max">Méthode : FC max</option>
            </select>
                
            <div class="container-input">
                <input type="number" id="age-user" placeholder="Âge *" autocomplete="off">
                <div class="label-input">Âge *</div>
            </div>

            <div class="container-input">
                <input type="number" id="fc-repos-user" placeholder="FC repos *" autocomplete="off">
                <div class="label-input" id="label-fc-user">FC repos *</div>
            </div>

            <div class="container-input">
                <input type="number" id="fc-max-user" placeholder="FC max" autocomplete="off">
                <div class="label-input">FC max</div>
            </div>

            <button id="button-calcul">Calculer</button>

        </div>

    </section>

    <section class="container-box">

        <div class="small-zone-result color-zone">
            <p class="small-zone-result-name">Zone 1</p>
            <p class="small-zone-result-indication">Récupération</p>

            <div class="container-result">
                <p class="small-zone-result-result">-- - --</p>
                <p class="small-zone-result-unit">bpm</p>
            </div>
        </div>

        <div class="small-zone-result color-zone">
            <p class="small-zone-result-name">Zone 2</p>
            <p class="small-zone-result-indication">Endurance fondamentale</p>


            <div class="container-result">
                <p class="small-zone-result-result">-- - --</p>
                <p class="small-zone-result-unit">bpm</p>
            </div>
        </div>

       <div class="small-zone-result color-zone">
            <div class="ensemble-p">
                <p class="small-zone-result-name">Zone 3</p>
                <p class="small-zone-result-indication">Aérobie</p>
            </div>

            <div class="container-result">
                <p class="small-zone-result-result">-- - --</p>
                <p class="small-zone-result-unit">bpm</p>
            </div>
        </div>
            
        <div class="small-zone-result color-zone">
            <div class="ensemble-p">
                <p class="small-zone-result-name">Zone 4</p>
                <p class="small-zone-result-indication">Anaérobie</p>
            </div>

            <div class="container-result">
                <p class="small-zone-result-result">-- - --</p>
                <p class="small-zone-result-unit">bpm</p>
            </div>
        </div>

        <div class="small-zone-result color-zone">
            <div class="ensemble-p">
                <p class="small-zone-result-name">Zone 5</p>
                <p class="small-zone-result-indication">Maximum</p>
            </div>

            <div class="container-result">
                <p class="small-zone-result-result">-- - --</p>
                <p class="small-zone-result-unit">bpm</p>
            </div>
        </div>

    </section>

    <script src="../../assets/base-js/base.js"></script>
    <!-- Import bibliothèque pour simplifier le code de indexed db -->
    <script src="../../assets/bibliotheques/dexie.js"></script>
    <script src="../../assets/base-js/db-config.js"></script> <!-- Connexion bdd -->
    <script src="script-outil.js"></script>
    
</body>
</html>
