<!DOCTYPE html>
<html lang="fr">
<head>
    <title>SPRINTIA - Temps de Récupération</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://vitals.vercel-insights.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" type="image/png" href="../../assets/icons-SPRINTIA/icon-navigateur.png">
    <link rel="manifest" href="../../manifest.json">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SPRINTIA">
    <link rel="apple-touch-icon" href="../../assets/icons-SPRINTIA/icon-192.png">

</head>

<body>
    <div class="container-logo-dynamique">
        <div class="logo-dynamique"></div>
    </div>
    
    <section class="header">

        <div class="logo" onclick="navigationLinks(this, 'header', 'profondeur2', 'Entraînement')">SPRINTIA</div>

        
        <ul class="header-container-items">

            <li class="header-items" onclick="navigationLinks(this, 'header', 'profondeur2', 'Entraînement')">
                <i class="icon_entrainement"></i>
                Entraînement
            </li>
            <li class="header-items" onclick="navigationLinks(this, 'header', 'profondeur2', 'Progression')">
                <i class="icon_progression"></i>
                Progression
            </li>
            <li class="header-items selected" onclick="navigationLinks(this, 'header', 'profondeur2', 'Outils')">
                <i class="icon_outils"></i>
                Outils
            </li>
            <li class="header-items" onclick="navigationLinks(this, 'header', 'profondeur2', 'Plus')">
                <i class="icon_plus"></i>
                Plus
            </li>

        </ul>

    </section>
    <section class="tab-bars">

        <ul class="tab-bars-container-items">

            <li class="tab-bars-items" onclick="navigationLinks(this, 'tab-bar', 'profondeur2', 'Entraînement')">
                <i class="icon_entrainement"></i>
                <p class="tab-bars-items-name">Entraînement</p>
            </li>
            <li class="tab-bars-items" onclick="navigationLinks(this, 'tab-bar', 'profondeur2', 'Progression')">
                <i class="icon_progression"></i>
                <p class="tab-bars-items-name">Progression</p>
            </li>
            <li class="tab-bars-items selected" onclick="navigationLinks(this, 'tab-bar', 'profondeur2', 'Outils')">
                <i class="icon_outils"></i>
                <p class="tab-bars-items-name">Outils</p>
            </li>
            <li class="tab-bars-items" onclick="navigationLinks(this, 'tab-bar', 'profondeur2', 'Plus')">
                <i class="icon_plus"></i>
                <p class="tab-bars-items-name">Plus</p>
            </li>

        </ul>

    </section>
    
    <div class="toolbar">
        <h1>Temps de Récupération</h1>
        <div class="container-command">
            <i class="icon_info" onclick="window.location.href = 'a-propos.html'"></i>
        </div>
    </div>

    <section class="container-zone">

        <div class="form"> 
            <select id="methode-user" onchange="comboBox()" autocomplete="off">
                <option value="occasionnel">Sportif·ve occasionnel·le</option>
                <option value="regulier">Sportif·ve régulier·e</option>
                <option value="athlete">Athlète confirmé·e</option>
            </select>
              
            <div class="container-input">
                <input type="text" id="duree-entrainement-user" placeholder="Durée (hh:mm:ss) *" title="Formats acceptés : hh:mm:ss ou mm:ss"
                maxlength="8" autocomplete="off">
                <div class="label-input">Durée (hh:mm:ss)</div>
            </div>
                
            <div class="slider-cont">
                <div class="slider-name">RPE : <span class="RPE">1</span><strong>Facile</strong></div>
                <div class="slider">
                    <input type="range" min="1" max="10" value="1" autocomplete="off">
                    <progress min="1" max="10" value="1"></progress>
                </div>
            </div>

            <button onclick="estimationTempsRecuperation()">Estimer</button>
        </div>

        <div class="large-zone-result">
            <p class="large-zone-result-name">Temps de récup. estimé</p>
            <p class="large-zone-result-result">
                -- h
            </p>
        </div>

    </section>

    <script src="../../assets/base-js/base.js"></script>
    <script src="script-outil.js"></script>

    <!-- Pour le RPE -->
    <script>
        let Slider = document.querySelector(".slider input")
        let Progress = document.querySelector(".slider progress")
        let Display = document.querySelector(".slider-name")
        const ressentiRPE = {
            1:"Facile",
            2:"Facile",
            3:"Facile",

            4:"Modéré",
            5:"Modéré",
            6:"Modéré",

            7:"Difficile",
            8:"Difficile",

            9:"Effort maximal",
            10:"Effort maximal"
        }

        Slider.addEventListener("input", function() {
            Progress.value = this.value
            Display.innerHTML = "RPE : " + "<span class='RPE'>" + String(this.value) + "</span>" + " " + "<strong>" + ressentiRPE[this.value] + "</strong>"
        })
        
        // pour détecter si lorsqu'on est dans le formulaire il y a un appuie sur la touche entrée
        let formKeyEntry = document.querySelector(".form")
        formKeyEntry.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                estimationTempsRecuperation()
            }
        })
    </script>
    
    

</body>
</html>
