<!DOCTYPE html>
<html lang="fr">
<head>
    <title>SPRINTIA - Historique</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" type="image/png" href="../../assets/icons-SPRINTIA/icon-navigateur.png">
    <link rel="manifest" href="../../manifest.json">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SPRINTIA">
    <link rel="apple-touch-icon" href="../../assets/icons-SPRINTIA/icon-192.png">

</head>

<body>
    <div class="container-logo-dynamique">
        <div class="logo-dynamique"></div>
    </div>
        
    <section class="header">

        <div class="logo">SPRINTIA</div>
            
        <ul class="header-container-items">

            <li class="header-items" data-onglet="Entraînement">
                <i class="icon_entrainement"></i>
                Entraînement
            </li>
            <li class="header-items" data-onglet="Progression">
                <i class="icon_progression"></i>
                Progression
            </li>
            <li class="header-items selected" data-onglet="Discussion">
                <i class="icon_discussion"></i>
                Discussion
            </li>
            <li class="header-items" data-onglet="Outils">
                <i class="icon_outils"></i>
                Outils
            </li>
            <li class="header-items" data-onglet="Plus">
                <i class="icon_plus"></i>
                Plus
            </li>

        </ul>

    </section>
    <section class="tab-bars">

        <ul class="tab-bars-container-items">

            <li class="tab-bars-items" data-onglet="Entraînement">
                <i class="icon_entrainement"></i>
                <p class="tab-bars-items-name">Entraînement</p>
            </li>
            <li class="tab-bars-items" data-onglet="Progression">
                <i class="icon_progression"></i>
                <p class="tab-bars-items-name">Progression</p>
            </li>
            <li class="tab-bars-items selected" data-onglet="Discussion">
                <i class="icon_discussion"></i>
                <p class="tab-bars-items-name">Discussion</p>
            </li>
            <li class="tab-bars-items" data-onglet="Outils">
                <i class="icon_outils"></i>
                <p class="tab-bars-items-name">Outils</p>
            </li>
            <li class="tab-bars-items" data-onglet="Plus">
                <i class="icon_plus"></i>
                <p class="tab-bars-items-name">Plus</p>
            </li>

        </ul>

    </section>

    <div class="toolbar">
        <h1>Historique</h1>
    </div>

    <div class="visuel-information" id="aucune-data">
        <i class="icon_folder_open"></i>
        <h3>Aucune discussion</h3>
        <p>
            Posez votre première question pour avoir accès à l'historique.
        </p>
    </div>

    <div class="input-search">
        <!-- pour un input on use pas "click()" on use "focus()" -->
        <i class="icon_search"></i>
        <input type="search" id="input-search" placeholder="Rechercher une question" autocomplete="off">
    </div>

    <div class="visuel-information" id="aucun-resultat">
        <i class="icon_search_off"></i>
        <h3>Aucun résultat</h3>
    </div>

    <div class="container-card-prompt skeleton" id="liste-question"></div>

    <div class="container-center-marge">
        <button id="button_afficher_plus">
            Afficher plus
        </button>
    </div>

    <script src="../../assets/base-js/base.js"></script>

    <!-- Import bibliothèque pour simplifier le code de indexed db -->
    <script src="../../assets/bibliotheques/dexie.js"></script>
    <script src="../../assets/base-js/db-config.js"></script> <!-- Connexion bdd -->
    <script src="script-historique.js"></script>
    
</body>
</html>
