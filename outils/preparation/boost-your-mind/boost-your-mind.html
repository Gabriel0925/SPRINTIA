<!DOCTYPE html>
<html lang="fr">
<head>
    <title>SPRINTIA - Boost your Mind</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">

    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="icon" type="image/png" href="../../../assets/icons-SPRINTIA/icon-navigateur.png">
    <link rel="manifest" href="../../../manifest.json">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SPRINTIA">
    <link rel="apple-touch-icon" href="../../../assets/icons-SPRINTIA/icon-192.png">

</head>

<body>
    <div class="container-logo-dynamique">
        <div class="logo-dynamique"></div>
    </div>
    
    <section class="header">
            
        <ul class="header-container-items">

            <li class="header-items" data-onglet="Entraînement">
                Entraînement
            </li>
            <li class="header-items" data-onglet="Progression">
                Progression
            </li>
            <li class="header-items" data-onglet="Discussion">
                Discussion
            </li>
            <li class="header-items selected" data-onglet="Outils">
                Outils
            </li>
            <li class="header-items" data-onglet="Plus">
                Plus
            </li>

        </ul>

    </section>
    <section class="tab-bars">

        <ul class="tab-bars-container-items">

            <li class="tab-bars-items" data-onglet="Entraînement">
                <i class="icon_entrainement"></i>
            </li>
            <li class="tab-bars-items" data-onglet="Progression">
                <i class="icon_progression"></i>
            </li>
            <li class="tab-bars-items" data-onglet="Discussion">
                <i class="icon_discussion"></i>
            </li>
            <li class="tab-bars-items selected" data-onglet="Outils">
                <i class="icon_outils"></i>
            </li>
            <li class="tab-bars-items" data-onglet="Plus">
                <i class="icon_plus"></i>
            </li>

        </ul>

    </section>
    
    <div class="toolbar">
        <h1>Boost your Mind</h1>
    </div>

    <section class="container-tabs-onglets">

        <div class="tabs-onglets selected" id="tabs-onglets-remotivation">
            <i class="icon_remotivation"></i>
            <p class="label">Remotivation</p>
        </div>
        <div class="tabs-onglets" id="tabs-onglets-mental">
            <i class="icon_mental"></i>
            <p class="label">Mental</p>
        </div>
        <div class="tabs-onglets" id="tabs-onglets-confiance">
            <i class="icon_confiance"></i>
            <p class="label">Confiance</p>
        </div>

    </section>

    <section class="container-phrase">

        <div class="track-phrase">
            <div class="button">
                <i class="icon_fleche_droite" id="precedent"></i>
                <i class="icon_autorenew" id="refresh"></i>
                <i class="icon_fleche_droite" id="suivant"></i>
            </div>

            <div class="phrases"></div>
            
        </div>

    </section>


    <script src="../../../assets/base-js/base.js"></script>
    <script src="script-boost-your-mind.js"></script>
    
</body>
</html>
