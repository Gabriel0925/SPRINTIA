<!DOCTYPE html>
<html lang="fr">
<head>
    <title>SPRINTIA - Protéines Quotidiennes</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' https: data:; connect-src 'self' https:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="icon" type="image/png" href="../../assets/icons-SPRINTIA/icon-navigateur.png">
    <link rel="manifest" href="../../manifest.json">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SPRINTIA">
    <link rel="apple-touch-icon" href="../../assets/icons-SPRINTIA/icon-192.png">

</head>

<body>
    <div class="container-logo-dynamique">
        <div class="logo-dynamique"></div>
    </div>
    
    <section class="header">

        <div class="logo" onclick="navigationLinks(this, 'header', 'profondeur2', 'Entraînement')">SPRINTIA</div>

        
        <ul class="header-container-items">

            <li class="header-items" onclick="navigationLinks(this, 'header', 'profondeur2', 'Entraînement')">
                <i class="icon_entrainement"></i>
                Entraînement
            </li>
            <li class="header-items" onclick="navigationLinks(this, 'header', 'profondeur2', 'Progression')">
                <i class="icon_progression"></i>
                Progression
            </li>
            <li class="header-items selected" onclick="navigationLinks(this, 'header', 'profondeur2', 'Outils')">
                <i class="icon_outils"></i>
                Outils
            </li>
            <li class="header-items" onclick="navigationLinks(this, 'header', 'profondeur2', 'Plus')">
                <i class="icon_plus"></i>
                Plus
            </li>

        </ul>

    </section>
    <section class="tab-bars">

        <ul class="tab-bars-container-items">

            <li class="tab-bars-items" onclick="navigationLinks(this, 'tab-bar', 'profondeur2', 'Entraînement')">
                <i class="icon_entrainement"></i>
                <p class="tab-bars-items-name">Entraînement</p>
            </li>
            <li class="tab-bars-items" onclick="navigationLinks(this, 'tab-bar', 'profondeur2', 'Progression')">
                <i class="icon_progression"></i>
                <p class="tab-bars-items-name">Progression</p>
            </li>
            <li class="tab-bars-items selected" onclick="navigationLinks(this, 'tab-bar', 'profondeur2', 'Outils')">
                <i class="icon_outils"></i>
                <p class="tab-bars-items-name">Outils</p>
            </li>
            <li class="tab-bars-items" onclick="navigationLinks(this, 'tab-bar', 'profondeur2', 'Plus')">
                <i class="icon_plus"></i>
                <p class="tab-bars-items-name">Plus</p>
            </li>

        </ul>

    </section>
    
    
    <div class="toolbar">
        <h1>Protéines Quotidiennes</h1>
        <div class="container-command">
            <i class="icon_info" onclick="window.location.href = 'a-propos.html'"></i>
        </div>
    </div>

    <section class="container-zone">

        <div class="form">
            <p id="zone-error" class="indication"></p>

            <select id="objectif-user" onchange="estimationProteines()" autocomplete="off">
                <option value="perte-poids">Objectif : Perte de poids</option>
                <option value="minimum">Objectif : Minimum vital</option>
                <option value="meilleure">Objectif : Meilleure santé</option>
                <option value="maintien">Objectif : Maintien de la masse</option>
                <option value="prise">Objectif : Prise de masse</option>
            </select>
                
            <div class="container-input">
                <input type="number" id="poids-user" placeholder="Poids (kg)" autocomplete="off" 
                oninput="estimationProteines()">
                <div class="label-input">Poids (kg)</div>
            </div>

        </div>

        <div class="large-zone-result">
            <p class="large-zone-result-name">Protéines recommandées</p>
            <p class="large-zone-result-result">
                -- g/jour
            </p>
        </div>
        
    </section>

    <script src="../../assets/base-js/base.js"></script>
    <!-- Import bibliothèque pour simplifier le code de indexed db -->
    <script src="../../assets/bibliotheques/dexie.js"></script>
    <script src="../../assets/base-js/db-config.js"></script> <!-- Connexion bdd -->
    <script src="script-outil.js"></script>
    <script>        
        window.addEventListener("DOMContentLoaded", async () => {
            await remplissageChamps(["poids-user"])

            if (document.getElementById("poids-user").value && !isNaN(document.getElementById("poids-user").value)) {
                estimationProteines()
            }
        })

        window.addEventListener("DOMContentLoaded", remplissageChamps(["poids-user"]))
        // pour détecter si lorsqu'on est dans le formulaire il y a un appuie sur la touche entrée
        let formKeyEntry = document.querySelector(".form")
        formKeyEntry.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                estimationProteines()
            }
        })
    </script>

    
    
</body>
</html>
